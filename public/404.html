<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | VeyoraLabs</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#07090E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #07090E;
        color: #E2E8F0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow-x: hidden;
      }
      .ambient-glow {
        position: absolute;
        width: 500px;
        height: 320px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(45, 212, 191, 0.1) 40%, rgba(129, 140, 248, 0.08) 70%, transparent 100%);
        border-radius: 50%;
        filter: blur(100px);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 0;
      }
      .card {
        position: relative;
        z-index: 1;
        max-width: 520px;
        width: 100%;
        padding: 48px 32px;
        background: rgba(18, 24, 38, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .logo-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: #FFFFFF;
        font-weight: 600;
        font-size: 1.125rem;
        margin-bottom: 32px;
      }
      .logo-link span {
        color: #38BDF8;
      }
      .error-code {
        font-size: clamp(4.5rem, 12vw, 6.5rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, #38BDF8 0%, #2DD4BF 50%, #818CF8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 16px;
      }
      .heading {
        font-size: 1.5rem;
        font-weight: 700;
        color: #FFFFFF;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      .description {
        font-size: 0.975rem;
        color: #94A3B8;
        line-height: 1.6;
        margin-bottom: 36px;
        max-width: 380px;
        margin-left: auto;
        margin-right: auto;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 28px;
        background: linear-gradient(90deg, #38BDF8, #2DD4BF);
        color: #07090E;
        font-weight: 600;
        font-size: 0.925rem;
        text-decoration: none;
        border-radius: 12px;
        transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);
      }
      .btn:hover {
        opacity: 0.95;
        transform: translateY(-2px);
        box-shadow: 0 14px 30px -5px rgba(56, 189, 248, 0.35);
      }
      .btn:focus-visible {
        outline: 2px solid #38BDF8;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <main class="card">
      <a href="/" class="logo-link" aria-label="Back to VeyoraLabs Home">
        <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="40" height="40" rx="10" fill="#0D111A" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
          <path d="M11 12L20 30L29 12" stroke="url(#logo-grad-404)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="20" cy="14" r="2" fill="#38BDF8" />
          <path d="M16.5 22L20 19L23.5 22" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <defs>
            <linearGradient id="logo-grad-404" x1="11" y1="12" x2="29" y2="30" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38BDF8" />
              <stop offset="0.5" stop-color="#2DD4BF" />
              <stop offset="1" stop-color="#818CF8" />
            </linearGradient>
          </defs>
        </svg>
        <span>Veyora<span>Labs</span></span>
      </a>

      <div class="error-code" aria-label="Error 404">404</div>
      <h1 class="heading">Page not found.</h1>
      <p class="description">The page you're looking for doesn't exist.</p>

      <a href="/" class="btn">
        <span>Back to VeyoraLabs</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </a>
    </main>
  </body>
</html>
